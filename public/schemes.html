<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LiveTrack | Schemes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="flex-container">
        <aside>
            <div class="logo"><i class="fas fa-microchip"></i> LiveTrack</div>
            <nav>
                <a href="MainDash.html" class="nav-link"><i class="fas fa-chart-pie"></i> Overview</a>
                <a href="registration.html" class="nav-link"><i class="fas fa-plus-circle"></i> New Entry</a>
                <a href="health.html" class="nav-link"><i class="fas fa-file-medical"></i> Health</a>
                <a href="schemes.html" class="nav-link active"><i class="fas fa-shield-alt"></i> Schemes</a>
            </nav>
        </aside>

        <main class="animate">
            <h1 style="font-size: 2rem; margin-bottom: 8px;">Available Schemes</h1>
            <p style="color: #6b7280; margin-bottom: 32px;">Government support for your farm</p>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div class="card" style="background: #111827; color: white;">
                    <h3 style="margin-bottom: 8px;">Pashu Kisan Credit Card</h3>
                    <p style="font-size: 14px; opacity: 0.7; margin-bottom: 24px;">Low-interest loans for livestock maintenance.</p>
                    <button class="btn-primary" style="background: white; color: #111827;">Apply Now</button>
                </div>

                <div class="card">
                    <h3 style="margin-bottom: 8px;">National Livestock Mission</h3>
                    <p style="font-size: 14px; color: #6b7280; margin-bottom: 24px;">Subsidies for breed improvement and fodder.</p>
                    <button class="btn-primary">View Details</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
