<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LiveTrack | Health</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="flex-container">
        <aside>
            <div class="logo"><i class="fas fa-microchip"></i> LiveTrack</div>
            <nav>
                <a href="MainDash.html" class="nav-link"><i class="fas fa-chart-pie"></i> Overview</a>
                <a href="registration.html" class="nav-link"><i class="fas fa-plus-circle"></i> New Entry</a>
                <a href="health.html" class="nav-link active"><i class="fas fa-file-medical"></i> Health</a>
                <a href="schemes.html" class="nav-link"><i class="fas fa-shield-alt"></i> Schemes</a>
            </nav>
        </aside>

        <main class="animate">
            <h1 style="font-size: 2rem; margin-bottom: 32px;">Vaccination Logs</h1>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Animal ID</th>
                            <th>Medical Action</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Mar 28, 2026</td>
                            <td><b>A-901</b></td>
                            <td>FMD Vaccination</td>
                            <td style="color: #16a34a; font-weight: bold;">Completed</td>
                        </tr>
                        <tr>
                            <td>Apr 10, 2026</td>
                            <td><b>G-402</b></td>
                            <td>Routine Checkup</td>
                            <td style="color: #f59e0b; font-weight: bold;">Scheduled</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
