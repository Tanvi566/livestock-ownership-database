<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LiveTrack | Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="flex-container">
        <aside>
            <div class="logo"><i class="fas fa-microchip"></i> LiveTrack</div>
            <nav>
                <a href="farmerDash.html" class="nav-link"><i class="fas fa-chart-pie"></i> Overview</a>
                <a href="registration.html" class="nav-link active"><i class="fas fa-plus-circle"></i> New Entry</a>
                <a href="health.html" class="nav-link"><i class="fas fa-file-medical"></i> Health</a>
                <a href="schemes.html" class="nav-link"><i class="fas fa-shield-alt"></i> Schemes</a>
            </nav>
        </aside>

        <main class="animate">
            <h1 style="font-size: 2rem; margin-bottom: 32px;">Register Livestock</h1>
            <div class="card" style="max-width: 600px;">
                <form>
                    <div class="form-group">
                        <label>Species</label>
                        <select>
                            <option>Cattle (Cow/Buffalo)</option>
                            <option>Goat/Sheep</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tag ID Number</label>
                        <input type="text" placeholder="e.g. A-1234">
                    </div>
                    <div class="form-group">
                        <label>Birth Date</label>
                        <input type="date">
                    </div>
                    <button class="btn-primary">Confirm Registration</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
