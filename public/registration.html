<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveTrack | Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

        :root {
            --primary-green: #16a34a;
            --bg-gray: #f9fafb;
            --border-color: #e5e7eb;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --sidebar-width: 288px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-gray); color: var(--text-dark); overflow-x: hidden; }

        /* --- Sidebar Logic (The Drawer) --- */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--border-color);
            padding: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            /* Critical: Start Hidden */
            transform: translateX(-100%); 
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Logic to show when active */
        #sidebar.sidebar-active {
            transform: translateX(0) !important;
        }

        /* Desktop Behavior: Always visible on large screens */
        @media (min-width: 1024px) {
            #sidebar {
                position: fixed;
                transform: translateX(0);
            }
            main { margin-left: var(--sidebar-width); }
            #menu-btn, #close-sidebar { display: none !important; }
        }

        .flex { display: flex; }
        .min-h-screen { min-height: 100vh; }
        .flex-1 { flex: 1; }

        /* Sidebar Styling */
        #sidebar {
            position: fixed;
            width: 288px; /* w-72 */
            height: 100vh;
            background: white;
            border-right: 1px solid var(--border-gray);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .sidebar-hidden { transform: translateX(-100%); }
        .sidebar-active { transform: translateX(0) !important; }

        /* Main Content Area */
        main {
            flex: 1;
            width: 100%;
            overflow-x: hidden;
            padding-bottom: 5rem;
        }

        /* Responsive Sidebar Logic for Desktop */
        @media (min-width: 1024px) {
            main { margin-left: 0; } /* Set to 288px if you want it permanently open */
            .sidebar-hidden { transform: translateX(-100%); }
        }

        .logo { color: var(--primary-green); font-weight: 800; font-size: 1.5rem; margin-bottom: 40px; display: flex; align-items: center; gap: 12px; }
        nav { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .nav-link { 
            display: flex; align-items: center; gap: 16px; padding: 14px 18px;
            text-decoration: none; color: var(--text-muted); font-weight: 500; border-radius: 16px; transition: 0.3s;
        }
        .nav-link:hover { background: #f3f4f6; color: var(--text-dark); }
        .nav-link.active { background: #f0fdf4; color: var(--primary-green); font-weight: 700; }

        /* --- Header --- */
        header {
            position: sticky; top: 0; z-index: 30; padding: 16px 24px;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        #menu-btn { 
            background: none; border: none; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; padding: 8px; border-radius: 50%;
        }
        .profile-img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-color); }

        /* --- Form Styling --- */
        .content-wrapper { max-width: 650px; margin: 40px auto; padding: 0 24px; animation: slideUp 0.8s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .form-card { background: white; padding: 40px; border-radius: 32px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; }
        input, select {
            width: 100%; padding: 16px; background: #f9fafb; border: 1px solid #e5e7eb;
            border-radius: 16px; outline: none; font-size: 1rem;
        }
        .btn-submit {
            width: 100%; background: var(--primary-green); color: white; border: none;
            padding: 18px; border-radius: 16px; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .btn-submit:hover { background: #15803d; transform: translateY(-2px); }
         #sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); z-index: 90;
        }
        #sidebar-overlay.active { display: block; }
    </style>
</head>
<body>

    <div id="sidebar-overlay"></div>

    <div class="app-container">
       <aside id="sidebar" class="sidebar-hidden">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem;">
                <div style="display: flex; align-items: center; gap: 0.75rem; color: #15803d; font-weight: 700; font-size: 1.5rem;">
                    <i class="fas fa-microchip"></i> <span>LiveTrack</span>
                </div>
                <button id="close-sidebar" style="background: none; border: none; color: #9ca3af; cursor: pointer;">
                    <i class="fas fa-times style='font-size: 1.25rem;'"></i>
                </button>
            </div>
            
            <nav style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
                <a href="farmerDash.html" class="nav-link"><i class="fas fa-chart-pie"></i> Overview</a>
                <a href="livestock.html" class="nav-link"><i class="fas fa-cow"></i> My Livestock</a>
                <a href="health.html" class="nav-link"><i class="fas fa-file-medical"></i> Health Records</a>
                <a href="schemes.html" class="nav-link"><i class="fas fa-shield-alt"></i> Schemes</a>
            </nav>

            <div style="padding: 1rem; background: #111827; border-radius: 1.5rem; color: white;">
                <p style="font-size: 10px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.1em;">Support</p>
                <p style="font-size: 0.875rem; font-weight: 600; margin-top: 0.25rem;">Need help with registration?</p>
                <button style="margin-top: 0.75rem; font-size: 0.75rem; background: var(--primary-green); color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.75rem; width: 100%; cursor: pointer;">Contact Agent</button>
            </div>
        </aside>

        <main>
            <header>
                <div class="header-left">
                    <button id="menu-btn"><i class="fas fa-ellipsis-v"></i></button>
                    <span style="font-weight: 800; color: #166534; font-size: 1.2rem;">Register Livestock</span>
                </div>
                <a href="MainDash.html">
                    <img src="https://ui-avatars.com/api/?name=Farmer+Joe&background=16a34a&color=fff" class="profile-img" alt="User">
                </a>
            </header>

            <div class="content-wrapper">
                <div class="form-card">
                    <form onsubmit="event.preventDefault(); alert('Success!');">
                        <div class="form-group">
                            <label>Species Type</label>
                            <select>
                                <option>Cattle (Cow/Buffalo)</option>
                                <option>Goat/Sheep</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tag ID Number</label>
                            <input type="text" placeholder="e.g. A-1234">
                        </div>
                        <div class="form-group">
                            <label>Birth Date</label>
                            <input type="date">
                        </div>
                        <button type="submit" class="btn-submit">Confirm Registration</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const closeBtn = document.getElementById('close-sidebar');

        menuBtn.onclick = () => { 
            sidebar.classList.add('sidebar-active'); 
            overlay.classList.add('active'); 
        };

        closeBtn.onclick = () => { 
            sidebar.classList.remove('sidebar-active'); 
            overlay.classList.remove('active'); 
        };

        overlay.onclick = () => { 
            sidebar.classList.remove('sidebar-active'); 
            overlay.classList.remove('active'); 
        };
    </script>
</body>
</html>
